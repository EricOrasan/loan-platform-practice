spring.application.name=loan-application-service

server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://localhost:5432/loan_application_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true

# Do not couple events to Java class names through Kafka headers
spring.kafka.producer.properties[spring.json.add.type.headers]=false

app.kafka.topics.loan-application-created=${LOAN_APPLICATION_CREATED_TOPIC:loan.application.created}

spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000

app.kafka.publish-timeout-seconds=${KAFKA_PUBLISH_TIMEOUT_SECONDS:12}