databaseChangeLog:
  - changeSet:
      id: 001-create-loan-offer
      author: eric

      changes:
        - createTable:
            tableName: loan_offer
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_loan_offer

              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: period_months
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: interest_rate
                  type: NUMERIC(5,2)
                  constraints:
                    nullable: false

              - column:
                  name: monthly_installment
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: loan_offer
            columnNames: application_id
            constraintName: uk_loan_offer_application_id

        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE loan_offer
                  ADD CONSTRAINT ck_loan_offer_amount
                  CHECK (amount > 0);

              ALTER TABLE loan_offer
                  ADD CONSTRAINT ck_loan_offer_period
                  CHECK (period_months BETWEEN 6 AND 120);

              ALTER TABLE loan_offer
                  ADD CONSTRAINT ck_loan_offer_interest_rate
                  CHECK (interest_rate > 0);

              ALTER TABLE loan_offer
                  ADD CONSTRAINT ck_loan_offer_monthly_installment
                  CHECK (monthly_installment > 0);

              ALTER TABLE loan_offer
                  ADD CONSTRAINT ck_loan_offer_status
                  CHECK (status IN ('GENERATED', 'NOT_GENERATED'));

      rollback:
        - dropTable:
            tableName: loan_offer
