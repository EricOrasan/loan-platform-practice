spring.application.name=audit-service

server.port=${SERVER_PORT:8086}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/audit_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:audit-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer

# Producer used for DLQ publishing
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true

# Topics
app.kafka.topics.loan-application-created=${LOAN_APPLICATION_CREATED_TOPIC:loan.application.created}
app.kafka.topics.loan-assessment-completed=${LOAN_ASSESSMENT_COMPLETED_TOPIC:loan.assessment.completed}
app.kafka.topics.loan-offer-generated=${LOAN_OFFER_GENERATED_TOPIC:loan.offer.generated}
app.kafka.topics.audit-events-dlq=${AUDIT_EVENTS_DLQ_TOPIC:audit.events.dlq}
