spring.application.name=credit-assessment-service

server.port=${SERVER_PORT:8083}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_assessment_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:credit-assessment-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.btproject.loanplatform.credit_assessment_service.infrastructure.messaging.in.LoanApplicationCreatedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.btproject.loanplatform.credit_assessment_service.infrastructure.messaging.in
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true

# Do not couple events to Java class names through Kafka headers
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# Topics
app.kafka.topics.loan-application-created=${LOAN_APPLICATION_CREATED_TOPIC:loan.application.created}
app.kafka.topics.loan-assessment-completed=${LOAN_ASSESSMENT_COMPLETED_TOPIC:loan.assessment.completed}
app.kafka.topics.loan-application-created-dlq=${LOAN_APPLICATION_CREATED_DLQ_TOPIC:loan.application.created.dlq}

# HTTP communication
app.clients.customer-service.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8081}

app.clients.customer-service.username=${CUSTOMER_SERVICE_USERNAME:user}
app.clients.customer-service.password=${CUSTOMER_SERVICE_PASSWORD:user123}

app.clients.customer-service.connect-timeout=${CUSTOMER_SERVICE_CONNECT_TIMEOUT:2s}
app.clients.customer-service.read-timeout=${CUSTOMER_SERVICE_READ_TIMEOUT:3s}
app.clients.customer-service.retry.max-attempts=${CUSTOMER_SERVICE_MAX_ATTEMPTS:3}
app.clients.customer-service.retry.backoff=${CUSTOMER_SERVICE_RETRY_BACKOFF:500ms}