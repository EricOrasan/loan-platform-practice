databaseChangeLog:
  - changeSet:
      id: 001-create-credit-assessment
      author: eric
      changes:
        - createTable:
            tableName: credit_assessment
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credit_assessment
                    nullable: false
              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: cif
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: score
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: decision
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: credit_assessment
            columnNames: application_id
            constraintName: uk_credit_assessment_application_id
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE credit_assessment
                  ADD CONSTRAINT chk_credit_assessment_cif
                      CHECK (cif ~ '^[0-9]{8}$'),
                  ADD CONSTRAINT chk_credit_assessment_score
                      CHECK (score BETWEEN 0 AND 100),
                  ADD CONSTRAINT chk_credit_assessment_decision
                      CHECK (decision IN ('APPROVED', 'REJECTED', 'MANUAL_REVIEW')),
                  ADD CONSTRAINT chk_credit_assessment_reason
                      CHECK (length(btrim(reason)) > 0);
